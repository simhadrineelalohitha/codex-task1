<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up · Sphere</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
</head>
<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="brand-badge" style="justify-content:center; display:inline-flex;">
          <div class="brand-logo-icon">⚡</div>
          <span>Sphere</span>
        </a>
        <h2>Create an account</h2>
        <p>Join the next-generation social network</p>
      </div>

      <div id="authError" class="alert-danger hidden"></div>

      <form id="registerForm">
        <div class="form-group" style="margin-bottom: 0.9rem;">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" class="form-control" placeholder="e.g. Alex Rivera" required />
        </div>

        <div class="form-group" style="margin-bottom: 0.9rem;">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. alex_rivera" required autocomplete="username" />
        </div>

        <div class="form-group" style="margin-bottom: 0.9rem;">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="alex@example.com" required autocomplete="email" />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" minlength="6" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--accent-primary); font-weight: 700;">Log In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
